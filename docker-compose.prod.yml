services:
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_AI_URL=${VITE_AI_URL}
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai_service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./ai_service/.env.production
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
