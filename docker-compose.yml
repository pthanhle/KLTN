services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai_service
    ports:
      - "8000:8000"
    env_file:
      - ./ai_service/.env
    depends_on:
      - redis
    volumes:
      - ./ai_service:/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
